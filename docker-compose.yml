# Kendi sunucunda çalıştırmak için: addon + FlareSolverr birlikte.
#
# ÖNEMLİ: Anti-bot cookie'si (cf_clearance) çıkış IP'sine bağlıdır. Bu yüzden
# addon ile FlareSolverr aynı ağda/sunucuda çalışmalı ki ikisi de aynı genel
# IP'den çıksın; aksi halde FlareSolverr'ın aldığı cookie addon'da geçersiz olur.
#
# Kullanım (en basit):
#   docker compose up -d --build
#
# Port 7000 doluysa PORT ile değiştir:
#   PORT=7701 docker compose up -d --build
#
# Sabit bir domain/reverse-proxy arkasındaysan HOST_URL ver (yoksa indirme
# linkleri otomatik olarak gelen isteğin adresinden türetilir):
#   HOST_URL=https://senin-adresin docker compose up -d --build

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Istanbul
    restart: unless-stopped

  addon:
    build: .
    container_name: turkcealtyaziorg-addon
    depends_on:
      - flaresolverr
    environment:
      - PORT=${PORT:-7000}
      # HOST_URL opsiyonel: boşsa indirme linkleri gelen isteğin adresinden
      # türetilir. Reverse-proxy/sabit domain arkasındaysan elle ver.
      - HOST_URL=${HOST_URL:-}
      - SITE_URL=https://turkcealtyazi.org
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
    ports:
      - "${PORT:-7000}:${PORT:-7000}"
    restart: unless-stopped
